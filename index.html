<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寰宇 · Earth Geography</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>"
    />
  </head>
  <body>
    <!-- 三维场景容器 -->
    <div id="scene" role="application" aria-label="互动地理地球：拖拽旋转，滚轮缩放，悬停查看国家，点击查看详情"></div>

    <!-- UI 悬浮层 -->
    <div id="ui">
      <header class="top-bar">
        <div class="brand">
          <h1>寰宇</h1>
          <p>互动地理探索</p>
        </div>
        <div class="search" id="search"></div>
      </header>
      <nav class="continents" id="continents" aria-label="大洲快捷定位"></nav>
      <div class="tooltip" id="tooltip"></div>
      <aside class="panel" id="panel" role="dialog" aria-label="国家详情卡"></aside>
      <footer class="hint">拖拽旋转 · 滚轮缩放 · 悬停查看国家 · 点击查看详情 · 搜索定位 · 大洲直达</footer>
    </div>

    <!-- 数据加载遮罩 -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在加载地球数据…</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
